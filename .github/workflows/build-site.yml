name: Build article data and deploy site

on:
  push:
    branches:
      - main
    paths:
      - "data/keisemi-article-index.xlsx"
      - "scripts/**"
      - "docs/**"

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        run: |
          install.packages(
            c("readxl", "readr", "jsonlite"),
            repos = "https://cloud.r-project.org"
          )
        shell: Rscript {0}

      - name: Generate CSV and JSON
        run: Rscript scripts/build_data.R

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/articles.csv docs/data/articles.json
          git diff --cached --quiet || git commit -m "Update generated article data"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4